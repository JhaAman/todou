[package]
name = "todou"
version = "0.1.0"
description = "A local-first task manager"
authors = ["Todou"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "todou_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "todou"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
parking_lot = "=0.12.5"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.3"
tokio = { version = "=1.53.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
